<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terrain render</title>
<!--
  The homepage landscapes (apps/docs/public/landing). A ray-marched height field drawn in one WebGL pass: rolling
  hills from value noise, round tree canopies, low sun with soft shadows, haze that thickens with distance, and
  film grain. Every scene is a set of numbers in SCENES below, so the pictures are ours and reproducible.
  Render with: node scripts/render-landscapes.mjs
  Query: s=<scene> w h  layer=1&cut=<distance> keeps only ground nearer than cut (the sky turns transparent).
-->
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R;
uniform vec3 skyTop, skyMid, skyHor, sunCol, grassA, grassB, treeCol;
uniform vec3 sunDir;
uniform float treeDensity, hillScale, seed, fogK, camH, layer, cut, pitch, rough;

float hash(vec2 p){p=fract(p*vec2(123.34,456.21)+seed);p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*noise(p);p=mat2(1.6,1.2,-1.2,1.6)*p;a*=.5;}return s;}

/* Rolling hills: two smooth layers, no sharp peaks. */
float terrain(vec2 p){
  float h=hillScale*(2.6*noise(p*.045)+1.3*noise(p*.11+3.1)+.35*noise(p*.27+7.));
  return h-hillScale*1.6;
}
/* Trees: at most one round canopy per 4 m cell, sitting on the ground. */
vec4 tree(vec3 p){
  vec2 cell=floor(p.xz/5.);vec2 c=cell*5.+2.5;
  float r=hash(cell*1.7);
  if(r>treeDensity) return vec4(1e5);
  c+=(vec2(hash(cell+.3),hash(cell+.9))-.5)*2.4;
  float rad=.3+.35*hash(cell+.5);
  float g=terrain(c);
  vec3 q=p-vec3(c.x,g+rad*.95,c.y);
  q.y*=.85;
  float d=length(q)-rad;
  d+= .08*(noise(q.xz*6.+q.y*4.)-.5);  /* lumpy foliage */
  return vec4(d*.7,c,rad);
}
vec2 map(vec3 p){
  float t=(p.y-terrain(p.xz))*.55;
  float tr=tree(p).x;
  return tr<t?vec2(tr,2.):vec2(t,1.);
}
vec3 normal(vec3 p,float t){vec2 e=vec2(.002*t+.002,0);
  return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float shadow(vec3 ro,vec3 rd){float res=1.,t=.05;
  for(int i=0;i<48;i++){float h=map(ro+rd*t).x;res=min(res,10.*h/t);t+=clamp(h,.05,1.5);if(res<.002||t>60.)break;}
  return clamp(res,0.,1.);}
vec3 sky(vec3 rd){
  float y=max(rd.y,0.);
  vec3 c=mix(skyHor,skyMid,smoothstep(-.02,.22,y));
  c=mix(c,skyTop,smoothstep(.12,.55,y));
  float s=max(dot(rd,sunDir),0.);
  c+=sunCol*.12*pow(s,5.)*exp(-y*14.);
  return c;
}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
  vec3 ro=vec3(0.,0.,0.); ro.y=terrain(ro.xz)+camH;
  vec3 ta=vec3(0.,ro.y-1.2,20.);
  vec3 ww=normalize(ta-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+(uv.y+pitch)*vv+1.9*ww);
  float t=.5;vec2 m=vec2(0.);
  for(int i=0;i<260;i++){m=map(ro+rd*t);if(abs(m.x)<.0015*t||t>220.)break;t+=m.x;}
  vec3 col;
  if(t>220.){col=sky(rd);}
  else{
    vec3 p=ro+rd*t,n=normal(p,t);
    /* velvet grass: fine noise tilts the normal and varies the colour */
    float gn=fbm(p.xz*3.);
    vec3 alb;
    if(m.y<1.5){n=normalize(n+rough*vec3(gn-.5,0.,fbm(p.xz*3.+5.)-.5));alb=mix(grassA,grassB,smoothstep(.3,.75,gn));
      alb*=.75+.5*smoothstep(-1.,1.5,p.y-terrain(p.xz+vec2(3.,0.)));}   /* darker in hollows */
    else{alb=treeCol*(.7+.6*fbm(p.xz*5.+p.y*3.));}
    float dif=clamp(dot(n,sunDir),0.,1.);
    float sh=shadow(p+n*.02,sunDir);
    float amb=.5+.5*n.y;
    float rim=pow(clamp(1.+dot(rd,n),0.,1.),3.)*clamp(dot(rd,sunDir)+.3,0.,1.);  /* backlit edges glow */
    vec3 lin=dif*sh*sunCol*1.4+amb*mix(skyMid,skyHor,.3)*.2+rim*sunCol*1.1;
    col=alb*lin;
    float fog=1.-exp(-pow(t*fogK,1.35)*1.4);
    col=mix(col,sky(normalize(vec3(rd.x,.01,rd.z)))*.85,fog);
  }
  col=aces(col*.95);
  col=pow(col,vec3(.4545));
  col+= (hash(gl_FragCoord.xy+seed)-.5)*.035; /* film grain */
  float a=1.;
  if(layer>.5){a=(t<cut)?1.:0.;}
  gl_FragColor=vec4(col*a,a);
}
</script>
<script>
const SCENES={
  vela:{skyTop:'#1b2228',skyMid:'#3d474c',skyHor:'#d39794',sunCol:'#ffb39a',grassA:'#2c3120',grassB:'#4a4a2c',treeCol:'#4a2422',
        sun:[-.3,.07,1],treeDensity:.09,hillScale:2.4,seed:.13,fogK:.0026,camH:5.5,pitch:.16,rough:.25},
  dunes:{skyTop:'#0d1014',skyMid:'#2a2d33',skyHor:'#b98783',sunCol:'#ffc7b0',grassA:'#a8736a',grassB:'#b07c74',treeCol:'#000000',
        sun:[.9,.12,.6],treeDensity:-1,hillScale:1.6,seed:.71,fogK:.003,camH:3.2,pitch:.1,rough:.04},
};
const name=new URLSearchParams(location.search).get('s')||'vela', S=SCENES[name];
const c=document.getElementById('c'),gl=c.getContext('webgl',{preserveDrawingBuffer:true,alpha:true,premultipliedAlpha:true});
const Q=new URLSearchParams(location.search);const W=+(Q.get('w')||1440),H=+(Q.get('h')||Math.round(W*820/1440));
c.width=W;c.height=H;gl.viewport(0,0,W,H);
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o};
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));
gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const hex=h=>[1,3,5].map(i=>Math.pow(parseInt(h.substr(i,2),16)/255,2.2)); /* to linear light */
const U=(n)=>gl.getUniformLocation(pr,n);
gl.uniform2f(U('R'),W,H);
for(const k of ['skyTop','skyMid','skyHor','sunCol','grassA','grassB','treeCol']) gl.uniform3fv(U(k),hex(S[k]));
const sd=S.sun,l=Math.hypot(...sd);gl.uniform3f(U('sunDir'),sd[0]/l,sd[1]/l,sd[2]/l);
for(const k of ['treeDensity','hillScale','seed','fogK','camH','pitch','rough']) gl.uniform1f(U(k),S[k]);
gl.uniform1f(U('layer'),+(Q.get('layer')||0));gl.uniform1f(U('cut'),+(Q.get('cut')||30));
gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();
const px=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
window.png=c.toDataURL(Q.get('type')||'image/webp',+(Q.get('q')||.86));window.done=true;
</script>
</body>
</html>
